# Publish the update site (docs/) so installed copies learn about a new version.
#
# The site is deployed by this workflow, not by pushing a branch: the deploy job only runs after
# packaging/check_update.py passes on the exact docs/update.json being published, so a hand-edited
# update.json with a dead or wrong-sized download link fails here instead of reaching users.
# packaging/check_packs.py runs alongside it, so a broken docs/library-packs.json (invalid JSON,
# dead pack URLs) fails the same way.
# For this to be the only way docs/ goes out, the repository's Pages source must be set to
# "GitHub Actions" (Settings -> Pages -> Source); publishing from a branch would bypass the check.
# packaging/publish.sh runs the same check before pushing, so a bad notice usually fails on the
# publisher's machine long before this workflow sees it.
name: Publish the update site
on:
  push:
    branches: [main]
    paths: [docs/**, packaging/check_update.py, packaging/check_packs.py, .github/workflows/publish-docs.yml]
  pull_request:
    paths: [docs/update.json, docs/library-packs.json, packaging/check_update.py, packaging/check_packs.py]
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    # dist/ is absent here, so the on-disk sha256 half of the check is skipped (it notes so);
    # the live-URL half, the part that reaches users, still runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/check_update.py
      - run: python3 packaging/check_packs.py
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
